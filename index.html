<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{--bg:#0d1b1e;--bg2:#142a2e;--ink:#eef5f4;--mute:#8fa9a8;--line:#2a4448}
:root[data-theme="light"]{--bg:#f3ecdc;--bg2:#e9dfc8;--ink:#2b2418;--mute:#7b6f58;--line:#cfc2a3}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 Inter,system-ui,sans-serif;transition:background .3s,color .3s;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.serif{font-family:Fraunces,Georgia,serif}
.theme{position:fixed;top:16px;right:16px;z-index:30;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px}

/* Intro */
#intro{position:fixed;inset:0;z-index:5;background:var(--bg);transition:opacity 1s}
#intro.out{opacity:0;pointer-events:none}
#intro p{position:absolute;top:34%;left:0;right:0;transform:translateY(-50%);text-align:center;padding:0 24px;font:300 clamp(20px,3.2vw,30px)/1.4 Fraunces,Georgia,serif}
#intro .hint{display:block;margin-top:14px;font:400 12px Inter,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:var(--mute)}

/* Play button: spins on its z axis, then shrinks to the corner */
.pp{position:fixed;z-index:20;perspective:500px;left:50%;top:62%;width:116px;height:116px;transform:translate(-50%,-50%);border:0;padding:0;background:none;border-radius:50%;transition:left .9s ease,top .9s ease,width .9s ease,height .9s ease}
.pp.mini{left:calc(100% - 46px);top:calc(100% - 46px);width:56px;height:56px}
.spin{position:absolute;inset:0;display:grid;place-items:center;animation:spin 5s linear infinite}
.pp.mini:not(.playing) .spin{animation:none}
.spin svg{fill:var(--ink);filter:drop-shadow(0 1px 5px rgba(0,0,0,.35))}
.one{width:60%}
@keyframes spin{to{transform:rotateY(360deg)}}

/* Home */
#home{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:64px 24px 40px;opacity:0;visibility:hidden;transition:opacity 1s .5s}
#home.show{opacity:1;visibility:visible}
h1{font:300 clamp(26px,5vw,46px)/1 Fraunces,Georgia,serif;letter-spacing:.14em;text-align:center}
.nm{font:500 16px Fraunces,Georgia,serif;letter-spacing:.3em;margin-bottom:22px}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2.5vw,28px);width:min(1000px,100%)}
.box{height:clamp(240px,50vh,400px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:var(--bg2);border:1px solid var(--line);font-size:13px;letter-spacing:.25em;transition:transform .25s,border-color .25s}
.box:hover{transform:translateY(-6px);border-color:var(--ink)}
.box svg{width:60%;max-height:70%}
.art{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
@media(max-width:720px){#home{justify-content:flex-start;overflow:auto}.boxes{grid-template-columns:1fr}.box{height:150px;flex-direction:row;gap:28px}.box svg{width:96px}}

/* Zoom view */
#view{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;opacity:0;transform:scale(.9);transition:opacity .45s,transform .45s}
#view.open{opacity:1;transform:none}
#view header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:20px;padding:14px 100px 14px 20px;background:var(--bg)}
#back{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 16px;font-size:13px}
#vt{font:300 26px Fraunces,Georgia,serif;letter-spacing:.1em}
#vc{padding:10px 20px 90px;max-width:1100px;margin:0 auto}
.ph{display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line);color:var(--mute);font-size:13px}

/* Photos: centered, revealed one by one */
.pics{display:flex;flex-wrap:wrap;justify-content:center;gap:34px 24px;padding:10px 0 40px}
.pic{width:min(100%,400px);text-align:center;opacity:0;transform:translateY(26px);transition:opacity .9s,transform .9s}
.pic.in{opacity:1;transform:none}
.pic img,.pic .ph{width:100%;aspect-ratio:4/5;object-fit:cover;display:grid}
.pic p{margin-top:12px;font:italic 300 17px/1.4 Fraunces,Georgia,serif}

/* Letter: scroll story */
.story{position:relative}
.stage{position:sticky;top:0;height:100vh;height:100dvh;margin-bottom:-100vh;margin-bottom:-100dvh;display:flex;align-items:center;justify-content:center;pointer-events:none}
.step{height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always}
#view.letter{overflow:hidden}
#view.letter header{position:fixed;left:0;right:0;top:0}
#view.letter #vc{padding:0;max-width:none}
.para{position:absolute;left:0;right:0;margin:0 auto;max-width:560px;opacity:0;transition:opacity .5s}
.para.on{opacity:1;transition:opacity .9s .35s}
.para h3{font:300 13px Inter,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.para p{font:300 clamp(19px,2.6vw,25px)/1.7 Fraunces,Georgia,serif;white-space:pre-line}
.cue{position:fixed;left:0;right:0;bottom:22px;z-index:12;display:flex;justify-content:center;pointer-events:none;transition:opacity .6s}
.cue.gone{opacity:0}
.cue button{pointer-events:auto;background:none;border:0;color:var(--ink);padding:10px 20px}
.cue.gone button{pointer-events:none}
.cue svg{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(9px);opacity:1}}

/* Videos */
.vgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.vgrid>*{width:min(100%,480px)}
.vgrid iframe,.vgrid .ph{width:100%;aspect-ratio:16/9;border:1px solid var(--line)}
.vgrid figcaption{margin-top:10px;text-align:center;font:italic 300 17px/1.4 Fraunces,Georgia,serif}

#black{position:fixed;inset:0;z-index:40;background:#000;opacity:0;pointer-events:none;transition:opacity 1s ease}
#yt{position:fixed;right:0;bottom:0;width:200px;height:200px;opacity:.01;pointer-events:none}
#msg{position:fixed;left:16px;bottom:14px;z-index:30;font-size:13px;color:var(--mute);max-width:60vw}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important}.spin{animation-duration:20s}}
</style>
</head>
<body>

<button class="theme" id="theme" aria-label="Switch between dark and light mode">Light mode</button>

<div id="intro"><p>For the full experience,<br>view this on a laptop with headphones.<span class="hint">Press play to begin</span></p></div>

<main id="home">
  <h1>HAPPY BIRTHDAY</h1>
  <div class="nm" id="nm"></div>
  <div class="boxes">
    <button class="box" data-k="photos" aria-label="Open photos">
      <svg viewBox="0 0 120 140" aria-hidden="true"><g transform="rotate(-5 60 70)"><rect x="14" y="10" width="92" height="116" rx="3" fill="#fff" stroke="var(--ink)" stroke-width="2"/><rect x="22" y="18" width="76" height="76" fill="var(--bg2)" stroke="var(--ink)" stroke-width="2"/><circle cx="76" cy="38" r="8" fill="var(--mute)"/><path d="M22 94L50 58L68 78L80 66L98 94Z" fill="var(--ink)" opacity=".55"/></g></svg>
    </button>
    <button class="box" data-k="letter" aria-label="Open letter">
      <svg viewBox="0 0 140 110" aria-hidden="true"><rect class="art" x="10" y="20" width="120" height="80" rx="4" fill="var(--bg)"/><path class="art" d="M10 24L70 66L130 24"/><path class="art" opacity=".5" d="M10 98L52 58M130 98L88 58"/><circle cx="70" cy="66" r="5" fill="var(--mute)"/></svg>
    </button>
    <button class="box" data-k="videos" aria-label="Open videos">
      <svg viewBox="0 0 140 110" aria-hidden="true"><circle class="art" cx="36" cy="24" r="14" fill="var(--bg)"/><circle class="art" cx="68" cy="24" r="14" fill="var(--bg)"/><rect class="art" x="10" y="38" width="88" height="56" rx="8" fill="var(--bg)"/><path class="art" d="M98 56L130 40V90L98 74Z" fill="var(--bg)"/><circle class="art" cx="54" cy="66" r="14"/><circle cx="54" cy="66" r="4" fill="var(--mute)"/></svg>
    </button>
  </div>
</main>

<div id="view" hidden>
  <header><button id="back">← Back</button><h2 id="vt"></h2></header>
  <div id="vc"></div>
</div>

<button class="pp" id="pp" aria-label="Play"><span class="spin"><svg class="one" viewBox="0 0 24 24" aria-hidden="true"><path id="ic" d="M8 5v14l11-7z"/></svg></span></button>
<div id="black"></div>
<div id="yt"></div>
<p id="msg" role="status"></p>

<script>
/* ====== EDIT THESE ====== */
const CONFIG = {
  name: "NAME",
  fade: { out: 1000, hold: 2000, in: 1500 },   // after the first play click: fade to black, stay black, fade back in (milliseconds)
  songId: "ynpObWVNKVs",   // the part after v= in the YouTube link
  // Photos: src is a path like "photos/1.jpg"; text is the description shown under it
  photos: [
    { src: "1.jpeg", text: "Taken in Chicago." },
    { src: "2.jpeg", text: "Taken in Mexico City" },
    { src: "3.jpeg", text: "Taken in New York City" },
    { src: "4.jpeg", text: "Taken in Queens" },
  ],
  // Letter: one paragraph shows at a time; scrolling fades it out and the next one in
  letter: [
    { title: "Happy birthday", text: "Write the first part of your letter here." },
    { title: "Chapter two", text: "Write the next part here.\n\nBlank lines make new paragraphs." },
    { title: "Chapter three", text: "Keep going. Add or remove chapters as you like." },
    { title: "The end", text: "Write your closing words here." }
  ],
  // Videos: id is the YouTube ID (the part after v=); text is the caption saying why it is here
  videos: []                // e.g. [{ id: "abc123XYZ", text: "Why this video is here." }, { id: "def456UVW", text: "Another reason." }]
};
/* ======================== */

const $ = s => document.querySelector(s);
$("#nm").textContent = CONFIG.name;

/* Theme */
const root = document.documentElement, tbtn = $("#theme");
function setTheme(t){ root.dataset.theme = t; tbtn.textContent = t === "dark" ? "Light mode" : "Dark mode"; try{localStorage.setItem("theme", t)}catch(e){} }
let saved = null; try{ saved = localStorage.getItem("theme") }catch(e){}
setTheme(saved || "dark");   // dark unless the visitor has switched to light before
tbtn.onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");

/* Music */
const pp = $("#pp"), ic = $("#ic"), msg = $("#msg");
const PLAY = "M8 5v14l11-7z", PAUSE = "M6 5h4v14H6zM14 5h4v14h-4z";
let player, ready = false, started = false, wantPlay = false;
if (location.protocol === "file:") msg.textContent = "Opened from a file: YouTube may refuse to play. Use the hosted link.";

function onYouTubeIframeAPIReady(){
  player = new YT.Player("yt", {
    width: 200, height: 200, videoId: CONFIG.songId,
    playerVars: Object.assign({ playsinline: 1, controls: 0, rel: 0 }, location.protocol.startsWith("http") ? { origin: location.origin } : {}),
    events: {
      onReady: () => { ready = true; if (wantPlay) player.playVideo(); },
      onStateChange: e => {
        const playing = e.data === 1;
        ic.setAttribute("d", playing ? PAUSE : PLAY);
        pp.classList.toggle("playing", playing);
        pp.setAttribute("aria-label", playing ? "Pause music" : "Play music");
        if (playing) msg.textContent = "";
      },
      onError: e => { msg.textContent = (e.data === 101 || e.data === 150) ? "This song can’t be played on other sites. Try another link." : "The song could not load (error " + e.data + ")."; }
    }
  });
}
const yts = document.createElement("script"); yts.src = "https://www.youtube.com/iframe_api"; document.head.append(yts);

pp.onclick = () => {
  if (!started) {
    started = true; wantPlay = true;
    if (ready) player.playVideo();
    const bl = $("#black"), F = CONFIG.fade;
    bl.style.pointerEvents = "auto";                        // blocks clicks during the fade
    bl.style.transitionDuration = F.out + "ms"; bl.style.opacity = 1;
    setTimeout(() => {                                      // fully black: swap the screens behind it
      $("#intro").hidden = true; pp.classList.add("mini"); $("#home").classList.add("show");
      setTimeout(() => { bl.style.transitionDuration = F["in"] + "ms"; bl.style.opacity = 0; bl.style.pointerEvents = "none"; }, F.hold);
    }, F.out);
    return;
  }
  if (!ready) return;
  player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
};

/* Zoom views */
const view = $("#view"), vc = $("#vc");
let letterGo = null;
function clearLetter(){ view.onscroll = view.onwheel = view.ontouchstart = view.ontouchend = null; letterGo = null; view.classList.remove("letter"); }
const TITLES = { photos: "Photos", letter: "Letter", videos: "Videos" };
const io = new IntersectionObserver(es => es.filter(e => e.isIntersecting).forEach((e, j) => { e.target.style.transitionDelay = (j * .4) + "s"; e.target.classList.add("in"); io.unobserve(e.target); }), { root: view, threshold: .2 });
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt) n.textContent = txt; return n; };

const builders = {
  photos(){
    const w = el("div", "pics");
    CONFIG.photos.forEach(p => {
      const c = el("figure", "pic");
      if (p.src) { const i = new Image(); i.src = p.src; i.alt = p.text; i.loading = "lazy"; c.append(i); } else c.append(el("div", "ph", "Add photo"));
      c.append(el("p", "", p.text)); w.append(c); io.observe(c);
    });
    vc.append(w);
  },
  letter(){
    const n = CONFIG.letter.length; if (!n) return;
    const story = el("div", "story"), stage = el("div", "stage");
    view.classList.add("letter");   // snap scrolling: one hard stop per paragraph
    const paras = CONFIG.letter.map(c => { const d = el("div", "para"); d.append(el("h3", "", c.title), el("p", "", c.text)); stage.append(d); return d; });
    story.append(stage); for (let k = 0; k < n; k++) story.append(el("div", "step")); vc.append(story);
    const cue = el("div", "cue");
    cue.innerHTML = '<button aria-label="Next paragraph"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6l7 7 7-7"/><path d="M5 12l7 7 7-7"/></svg></button>';
    vc.append(cue);
    let cur = -1;
    const upd = () => {
      const i = Math.min(n - 1, Math.max(0, Math.round(view.scrollTop / (view.clientHeight || innerHeight))));
      if (i === cur) return; cur = i;
      paras.forEach((d, j) => d.classList.toggle("on", j === i));   // old paragraph fades out, then the next fades in
      cue.classList.toggle("gone", i === n - 1);                    // arrow stays until the last paragraph
    };
    view.onscroll = upd; upd();
    // Paging: every wheel flick, swipe or key press moves exactly one paragraph, then waits for the motion to settle
    let until = 0, y0 = 0;
    const go = d => {
      const now = Date.now();
      if (now < until) { until = Math.max(until, now + 250); return; }   // still settling (also swallows trackpad momentum)
      const i = Math.min(n - 1, Math.max(0, cur + d));
      if (i === cur) return;
      until = now + 800;
      view.scrollTo({ top: i * view.clientHeight, behavior: "smooth" });
    };
    letterGo = go;
    cue.firstChild.onclick = () => go(1);   // the arrow is a button too
    view.onwheel = e => { if (Math.abs(e.deltaY) > 2) go(e.deltaY > 0 ? 1 : -1); };
    view.ontouchstart = e => { y0 = e.touches[0].clientY; };
    view.ontouchend = e => { const dy = y0 - e.changedTouches[0].clientY; if (Math.abs(dy) > 40) go(dy > 0 ? 1 : -1); };
  },
  videos(){
    const g = el("div", "vgrid");
    const list = CONFIG.videos.length ? CONFIG.videos : [null, null, null, null];
    list.forEach(v => {
      const f = el("figure"), id = v && (v.id || v), text = v ? (v.text || "") : "Add a caption explaining why this video is here.";
      if (id) { const i = el("iframe"); i.src = "https://www.youtube.com/embed/" + id; i.allow = "encrypted-media; picture-in-picture; fullscreen"; i.allowFullscreen = true; i.loading = "lazy"; i.title = text || "Video"; f.append(i); }
      else f.append(el("div", "ph", "Add a video"));
      if (text) f.append(el("figcaption", "", text));
      g.append(f);
    });
    vc.append(g);
  }
};

function openView(k, box){
  const r = box.getBoundingClientRect();
  view.style.transformOrigin = (r.left + r.width / 2) + "px " + (r.top + r.height / 2) + "px";
  clearLetter(); vc.innerHTML = ""; $("#vt").textContent = TITLES[k]; builders[k](); view.scrollTop = 0;
  view.hidden = false; view.scrollTop = 0; if (view.onscroll) view.onscroll();   // always start at the top
  requestAnimationFrame(() => requestAnimationFrame(() => view.classList.add("open")));
  $("#back").focus();
}
function closeView(){
  view.classList.remove("open");
  setTimeout(() => { view.scrollTop = 0; view.hidden = true; vc.innerHTML = ""; clearLetter(); }, 450);   // also stops any playing video
}
document.querySelectorAll(".box").forEach(b => b.onclick = () => openView(b.dataset.k, b));
$("#back").onclick = closeView;
addEventListener("keydown", e => {
  if (view.hidden) return;
  if (e.key === "Escape") closeView();
  else if (letterGo && (e.key === "ArrowDown" || e.key === "PageDown")) { e.preventDefault(); letterGo(1); }
  else if (letterGo && (e.key === "ArrowUp" || e.key === "PageUp")) { e.preventDefault(); letterGo(-1); }
});
</script>
</body>
</html>
