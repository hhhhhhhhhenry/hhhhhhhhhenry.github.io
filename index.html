<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{--bg:#0d1b1e;--bg2:#142a2e;--ink:#eef5f4;--mute:#8fa9a8;--line:#2a4448}
:root[data-theme="light"]{--bg:#f3ecdc;--bg2:#e9dfc8;--ink:#2b2418;--mute:#7b6f58;--line:#cfc2a3}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 Inter,system-ui,sans-serif;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.theme{position:fixed;top:16px;right:16px;z-index:5;background:none;border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}

/* Hero */
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:72px 20px 40px;text-align:center}
h1{font:300 clamp(34px,7vw,64px)/1 Fraunces,Georgia,serif;letter-spacing:.14em}
.play{width:min(78vw,380px);aspect-ratio:16/10;display:grid;place-items:center;border:1px solid var(--ink);background:var(--bg2);color:var(--ink);cursor:pointer;transition:transform .2s}
.play:active{transform:scale(.98)}
.play{position:relative;overflow:hidden;padding:0}
.play img,.play canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play[hidden],.play [hidden]{display:none}
.play svg{position:relative;width:54px;height:54px;fill:currentColor;filter:drop-shadow(0 1px 6px rgba(0,0,0,.5))}
.play.has-gif{aspect-ratio:1/1;width:min(64vw,300px);background:#fafafb;border-color:var(--line)}
.play.has-gif img,.play.has-gif canvas{object-fit:contain}
.play.has-gif svg{fill:#2b2b2b;opacity:.75;filter:none}
.name{font:500 22px Fraunces,Georgia,serif;letter-spacing:.3em}
.bar{width:min(78vw,380px)}
.bar input{width:100%;accent-color:var(--ink);cursor:pointer}
.times{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:13px;color:var(--mute)}
.nav{display:flex;gap:clamp(22px,6vw,56px);font-size:13px;letter-spacing:.2em}
.nav a{padding:6px 2px;border-bottom:1px solid transparent}
.nav a:hover{border-color:var(--ink)}
#yt{position:fixed;right:0;bottom:0;width:200px;height:200px;opacity:.01;pointer-events:none}
.status{font-size:13px;color:var(--mute);max-width:380px;min-height:1.6em}
.status a{text-decoration:underline}

/* Sections */
section.page{min-height:100svh;padding:90px 22px 60px;max-width:900px;margin:0 auto}
section.page h2{font:300 34px Fraunces,Georgia,serif;letter-spacing:.1em;margin-bottom:28px}
.top{display:inline-block;margin-top:36px;color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.grid img,.ph{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--bg2);border:1px solid var(--line)}
.ph{display:grid;place-items:center;color:var(--mute);font-size:13px}
.letter{font:300 19px/1.8 Fraunces,Georgia,serif;max-width:560px;white-space:pre-line}
.vids{display:grid;gap:16px}
.vids iframe,.vids video{width:100%;aspect-ratio:16/9;border:1px solid var(--line);background:var(--bg2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<button class="theme" id="theme" aria-label="Switch between dark and light mode">Light mode</button>

<header class="hero" id="top">
  <h1 id="title">HAPPY BIRTHDAY</h1>

  <button class="play" id="play" aria-label="Play song">
    <canvas id="still" hidden></canvas>
    <img id="anim" alt="" hidden>
    <svg id="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>

  <div class="name" id="name">NAME</div>

  <div class="bar">
    <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Song position">
    <div class="times"><span id="cur">00:00</span><span id="dur">00:00</span></div>
  </div>
  <p class="status" id="status" role="status"></p>

  <nav class="nav">
    <a href="#photos">PHOTOS</a>
    <a href="#letter">LETTER</a>
    <a href="#videos">VIDEOS</a>
  </nav>
</header>

<section class="page" id="photos">
  <h2>Photos</h2>
  <div class="grid" id="photoGrid"></div>
  <a class="top" href="#top">Back to top</a>
</section>

<section class="page" id="letter">
  <h2>Letter</h2>
  <p class="letter" id="letterText"></p>
  <a class="top" href="#top">Back to top</a>
</section>

<section class="page" id="videos">
  <h2>Videos</h2>
  <div class="vids" id="videoList"></div>
  <a class="top" href="#top">Back to top</a>
</section>

<div id="yt"></div>

<script>
/* ====== EDIT THESE ====== */
const CONFIG = {
  name: "NAME",
  songId: "5rrbVA6zYKI",           // the part after v= in the YouTube link
  playGif: "play.gif",              // path to your gif (keep play.gif in the same folder as this page; "" = plain play icon)
  photos: [],                       // e.g. ["photos/1.jpg", "photos/2.jpg"]
  videos: [],                       // YouTube IDs like "abc123XYZ" or file paths like "clips/one.mp4"
  letter: "Write your letter here.\n\nBlank lines make new paragraphs."
};
/* ======================== */

document.getElementById("name").textContent = CONFIG.name;
document.getElementById("letterText").textContent = CONFIG.letter;

// Photos
const grid = document.getElementById("photoGrid");
if (CONFIG.photos.length) {
  CONFIG.photos.forEach(src => { const i = new Image(); i.src = src; i.alt = ""; i.loading = "lazy"; grid.append(i); });
} else {
  for (let n = 0; n < 6; n++) { const d = document.createElement("div"); d.className = "ph"; d.textContent = "Add photo"; grid.append(d); }
}

// Videos
const list = document.getElementById("videoList");
if (CONFIG.videos.length) {
  CONFIG.videos.forEach(v => {
    let el;
    if (/\.(mp4|webm|mov)$/i.test(v)) { el = document.createElement("video"); el.src = v; el.controls = true; }
    else { el = document.createElement("iframe"); el.src = "https://www.youtube.com/embed/" + v; el.allowFullscreen = true; el.loading = "lazy"; }
    list.append(el);
  });
} else {
  const d = document.createElement("div"); d.className = "ph"; d.style.aspectRatio = "16/9"; d.textContent = "Add a video"; list.append(d);
}

// Theme (starts with the device setting, remembers the choice if the browser allows)
const root = document.documentElement, tbtn = document.getElementById("theme");
function setTheme(t){ root.dataset.theme = t; tbtn.textContent = t === "dark" ? "Light mode" : "Dark mode"; try{localStorage.setItem("theme", t)}catch(e){} }
let saved = null; try{ saved = localStorage.getItem("theme") }catch(e){}
setTheme(saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
tbtn.onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");

// YouTube player
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); };
const cur = document.getElementById("cur"), dur = document.getElementById("dur"), seek = document.getElementById("seek");
const icon = document.getElementById("icon"), playBtn = document.getElementById("play");
const PLAY = "M8 5v14l11-7z", PAUSE = "M6 5h4v14H6zM14 5h4v14h-4z";
// Gif play button: the first frame is drawn to a canvas (looks paused); the real gif runs while the song plays
const still = document.getElementById("still"), anim = document.getElementById("anim");
let gifReady = false;
if (CONFIG.playGif) {
  playBtn.classList.add("has-gif");
  const probe = new Image();
  probe.onload = () => {
    still.width = probe.naturalWidth; still.height = probe.naturalHeight;
    still.getContext("2d").drawImage(probe, 0, 0);
    gifReady = true; still.hidden = false;
  };
  probe.onerror = () => { statusEl.textContent = "Could not find " + CONFIG.playGif + ". Upload it to the same folder as this page."; };
  probe.src = CONFIG.playGif;
}
function showGif(playing){
  if (!gifReady) return;
  still.hidden = playing;
  anim.hidden = !playing;
  icon.style.display = playing ? "none" : "";
  if (playing) { anim.src = ""; anim.src = CONFIG.playGif; } // restarts the gif from its first frame
}
const statusEl = document.getElementById("status");
if (location.protocol === "file:") statusEl.textContent = "Opened from a file: YouTube may refuse to play. Host the page to be sure.";
let player, dragging = false, ticker;

function onYouTubeIframeAPIReady(){
  player = new YT.Player("yt", {
    width: 200, height: 200, videoId: CONFIG.songId,
    playerVars: Object.assign({ playsinline: 1, controls: 0, rel: 0 }, location.protocol.startsWith("http") ? { origin: location.origin } : {}),
    events: {
      onReady: () => { dur.textContent = fmt(player.getDuration()); statusEl.textContent = ""; },
      onError: e => {
        const c = e.data;
        statusEl.innerHTML = (c === 101 || c === 150)
          ? 'The owner of this video blocks playing it on other sites. <a href="https://www.youtube.com/watch?v=' + CONFIG.songId + '" target="_blank" rel="noopener">Open on YouTube</a> or pick another song.'
          : (c === 153 || location.protocol === "file:")
          ? 'YouTube won\'t play from a file on your computer. Host the page (for example on GitHub Pages) and try again. (error ' + c + ')'
          : 'The song could not load. (error ' + c + ')';
      },
      onStateChange: e => {
        const playing = e.data === YT.PlayerState.PLAYING;
        icon.firstElementChild.setAttribute("d", playing ? PAUSE : PLAY);
        showGif(playing);
        playBtn.setAttribute("aria-label", playing ? "Pause song" : "Play song");
        dur.textContent = fmt(player.getDuration());
        clearInterval(ticker);
        if (playing) ticker = setInterval(tick, 250);
      }
    }
  });
}
function tick(){
  if (dragging) return;
  const d = player.getDuration(), t = player.getCurrentTime();
  cur.textContent = fmt(t);
  if (d) seek.value = (t / d) * 100;
}
playBtn.onclick = () => {
  if (!player || !player.getPlayerState) return;
  player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
};
seek.addEventListener("input", () => { dragging = true; cur.textContent = fmt(player.getDuration() * seek.value / 100); });
seek.addEventListener("change", () => { player.seekTo(player.getDuration() * seek.value / 100, true); dragging = false; });

const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.append(s);
</script>
</body>
</html>
